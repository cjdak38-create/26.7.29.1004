<!DOCTYPE html>
<html lang="ko" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화려한 3D 로또 29 뽑기 머신 (극상 연출)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap');
        body {
            font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        /* Custom Glowing & Glass Effects */
        .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .glow-gold {
            box-shadow: 0 0 35px rgba(234, 179, 8, 0.45);
        }
        .glow-cyan {
            box-shadow: 0 0 35px rgba(6, 182, 212, 0.45);
        }

        /* Sunburst Background for Suspense Reveal */
        @keyframes sunburstSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-sunburst {
            animation: sunburstSpin 12s linear infinite;
        }

        /* Ball Pop Animation */
        @keyframes ballPop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(15deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-ball-pop {
            animation: ballPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Dramatic Zoom Reveal */
        @keyframes revealZoom {
            0% { transform: scale(0.1) rotate(-30deg); opacity: 0; filter: blur(12px); }
            60% { transform: scale(1.35) rotate(10deg); opacity: 1; filter: blur(0px); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0px); }
        }
        @keyframes superGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(234, 179, 8, 0.8), inset 0 0 25px rgba(255, 255, 255, 0.9); }
            50% { box-shadow: 0 0 90px rgba(245, 158, 11, 1), inset 0 0 40px rgba(255, 255, 255, 1); }
        }
        .animate-reveal-super {
            animation: revealZoom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.3) forwards;
        }
        .animate-super-glow {
            animation: superGlow 1.5s infinite ease-in-out;
        }

        /* Ambient background orb blur */
        .bg-glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }

        /* Shimmering Text Gradient */
        .text-shimmer {
            background: linear-gradient(90deg, #fef08a, #f59e0b, #38bdf8, #f472b6, #fef08a);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerWave 4s linear infinite;
        }
        @keyframes shimmerWave {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full flex flex-col relative antialiased selection:bg-amber-500 selection:text-black">

    <!-- AUDIO SYNTHESIZER & THREE.JS LOGIC -->
    <script>
        // =========================================================
        // ENHANCED SUPER-CHARGED WEB AUDIO SYNTHESIZER
        // =========================================================
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.bgmEnabled = false;
                this.bgmOsc = null;
                this.bgmGain = null;
                this.bgmInterval = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Button Click Click SFX
            playClick() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.04);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.04);
            }

            // Ball Collision Pop/Tumble
            playPop() {
                if (!this.enabled) return;
                this.init();
                
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'triangle';
                const freq = 300 + Math.random() * 500;
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(90, now + 0.05);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.05);
            }

            // Rapid Mechanical Ticker Click for Slot Suspense Roll
            playTicker() {
                if (!this.enabled) return;
                this.init();
                
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'square';
                osc.frequency.setValueAtTime(1200 + Math.random() * 300, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.02);

                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.02);
            }

            // Air Riser & Suction Whoosh FX
            playRiser() {
                if (!this.enabled) return;
                this.init();

                const now = this.ctx.currentTime;

                // Sub bass sweep
                const subOsc = this.ctx.createOscillator();
                const subGain = this.ctx.createGain();
                subOsc.type = 'sine';
                subOsc.frequency.setValueAtTime(80, now);
                subOsc.frequency.exponentialRampToValueAtTime(600, now + 0.6);

                subGain.gain.setValueAtTime(0.05, now);
                subGain.gain.linearRampToValueAtTime(0.35, now + 0.45);
                subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

                subOsc.connect(subGain);
                subGain.connect(this.ctx.destination);

                subOsc.start(now);
                subOsc.stop(now + 0.65);

                // Sawtooth Whoosh with Biquad Filter Sweep
                const synthOsc = this.ctx.createOscillator();
                const synthGain = this.ctx.createGain();
                synthOsc.type = 'sawtooth';
                synthOsc.frequency.setValueAtTime(180, now);
                synthOsc.frequency.exponentialRampToValueAtTime(1800, now + 0.6);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(300, now);
                filter.frequency.exponentialRampToValueAtTime(3200, now + 0.6);

                synthGain.gain.setValueAtTime(0.02, now);
                synthGain.gain.linearRampToValueAtTime(0.25, now + 0.5);
                synthGain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

                synthOsc.connect(filter);
                filter.connect(synthGain);
                synthGain.connect(this.ctx.destination);

                synthOsc.start(now);
                synthOsc.stop(now + 0.65);
            }

            // Heavy Sub Impact + Sparkling Arpeggio Chime
            playDramaticReveal(isBonus = false) {
                if (!this.enabled) return;
                this.init();

                const now = this.ctx.currentTime;

                // 1. Massive Sub-Bass Bomb Impact
                const bassOsc = this.ctx.createOscillator();
                const bassGain = this.ctx.createGain();
                bassOsc.type = 'sine';
                bassOsc.frequency.setValueAtTime(isBonus ? 200 : 150, now);
                bassOsc.frequency.exponentialRampToValueAtTime(25, now + 0.5);

                bassGain.gain.setValueAtTime(0.65, now);
                bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

                bassOsc.connect(bassGain);
                bassGain.connect(this.ctx.destination);
                bassOsc.start(now);
                bassOsc.stop(now + 0.55);

                // 2. Delay Echo Effect simulation for spatial reverberation
                const delay = this.ctx.createDelay();
                delay.delayTime.value = 0.12;
                const delayGain = this.ctx.createGain();
                delayGain.gain.value = 0.35;

                // 3. Orchestral / Casino Jackpot Chord
                const chords = isBonus 
                    ? [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98] // C Major 7th Sparkle
                    : [440.00, 554.37, 659.25, 880.00, 1108.73, 1318.51]; // A Major Harmonic

                chords.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
                    const startTime = now + idx * 0.04;

                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.3, startTime + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.9);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    // Route to delay echo
                    osc.connect(delay);
                    delay.connect(delayGain);
                    delayGain.connect(this.ctx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.9);
                });
            }

            // Grand Jackpot Victory Fanfare
            playFanfare() {
                if (!this.enabled) return;
                this.init();

                const now = this.ctx.currentTime;

                // Triumphant Fanfare Sequence
                const sequence = [
                    { freq: 523.25, time: 0, duration: 0.12 },    // C5
                    { freq: 659.25, time: 0.12, duration: 0.12 }, // E5
                    { freq: 783.99, time: 0.24, duration: 0.12 }, // G5
                    { freq: 1046.50, time: 0.36, duration: 0.22 }, // C6
                    { freq: 880.00, time: 0.58, duration: 0.14 },  // A5
                    { freq: 1046.50, time: 0.72, duration: 0.7 }  // C6 Sustained
                ];

                sequence.forEach(note => {
                    const noteTime = now + note.time;
                    
                    // Main Lead Synth
                    const osc1 = this.ctx.createOscillator();
                    const gain1 = this.ctx.createGain();
                    osc1.type = 'triangle';
                    osc1.frequency.setValueAtTime(note.freq, noteTime);

                    gain1.gain.setValueAtTime(0.35, noteTime);
                    gain1.gain.exponentialRampToValueAtTime(0.001, noteTime + note.duration + 0.2);

                    osc1.connect(gain1);
                    gain1.connect(this.ctx.destination);
                    osc1.start(noteTime);
                    osc1.stop(noteTime + note.duration + 0.2);

                    // Sub Octave Saw Layer
                    const osc2 = this.ctx.createOscillator();
                    const gain2 = this.ctx.createGain();
                    osc2.type = 'sawtooth';
                    osc2.frequency.setValueAtTime(note.freq / 2, noteTime);

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(1400, noteTime);

                    gain2.gain.setValueAtTime(0.15, noteTime);
                    gain2.gain.exponentialRampToValueAtTime(0.001, noteTime + note.duration + 0.15);

                    osc2.connect(filter);
                    filter.connect(gain2);
                    gain2.connect(this.ctx.destination);
                    osc2.start(noteTime);
                    osc2.stop(noteTime + note.duration + 0.15);
                });
            }

            // Ambient Casino BGM Loop Synthesizer
            toggleBGM() {
                this.bgmEnabled = !this.bgmEnabled;
                if (this.bgmEnabled) {
                    this.startBGM();
                } else {
                    this.stopBGM();
                }
                return this.bgmEnabled;
            }

            startBGM() {
                this.init();
                if (this.bgmInterval) clearInterval(this.bgmInterval);

                const scale = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63]; // C Minor Pentatonic Bass Loop
                let step = 0;

                this.bgmInterval = setInterval(() => {
                    if (!this.bgmEnabled) return;
                    const now = this.ctx.currentTime;
                    const freq = scale[step % scale.length];
                    step++;

                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);

                    gain.gain.setValueAtTime(0.03, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    osc.stop(now + 0.3);
                }, 320);
            }

            stopBGM() {
                if (this.bgmInterval) {
                    clearInterval(this.bgmInterval);
                    this.bgmInterval = null;
                }
            }
        }

        const soundEngine = new SoundEngine();

        // =========================================================
        // THREE.JS 3D LOTTERY MACHINE CONTROLLER WITH PARTICLES
        // =========================================================
        class Lotto3DMachine {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.balls = []; 
                this.drawnNumbers = [];
                this.isMixing = true;
                this.isDrawing = false;
                
                // Ball color palette by number 1-29
                this.getBallColor = (num) => {
                    if (num <= 10) return { main: '#f59e0b', text: '#78350f', label: 'amber' };   // Amber Gold
                    if (num <= 20) return { main: '#06b6d4', text: '#164e63', label: 'cyan' };    // Cyan Blue
                    return { main: '#a855f7', text: '#3b0764', label: 'purple' };                 // Vivid Purple
                };

                this.initScene();
                this.createMachineStructure();
                this.createParticleSystem();
                this.createBalls();
                this.setupInteraction();
                this.animate();
            }

            initScene() {
                const width = this.container.clientWidth;
                const height = this.container.clientHeight;

                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(0x020617, 0.022);

                this.camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
                this.camera.position.set(0, 1.5, 13);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                this.container.appendChild(this.renderer.domElement);

                // Dynamic Strobe Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
                this.scene.add(ambientLight);

                this.spotLight = new THREE.SpotLight(0xffb703, 3);
                this.spotLight.position.set(5, 12, 8);
                this.spotLight.angle = Math.PI / 4;
                this.spotLight.penumbra = 0.8;
                this.spotLight.castShadow = true;
                this.scene.add(this.spotLight);

                this.blueLight = new THREE.PointLight(0x06b6d4, 2.5, 15);
                this.blueLight.position.set(-6, -2, 4);
                this.scene.add(this.blueLight);

                this.purpleLight = new THREE.PointLight(0xd946ef, 2.2, 15);
                this.purpleLight.position.set(6, -2, -4);
                this.scene.add(this.purpleLight);

                window.addEventListener('resize', () => this.onWindowResize());
            }

            createMachineStructure() {
                // Glass Chamber Globe
                const globeGeo = new THREE.SphereGeometry(3.6, 48, 48);
                const globeMat = new THREE.MeshPhysicalMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.2,
                    roughness: 0.08,
                    metalness: 0.1,
                    transmission: 0.88,
                    ior: 1.35,
                    reflectivity: 0.95,
                    clearcoat: 1.0,
                    side: THREE.DoubleSide
                });
                this.globe = new THREE.Mesh(globeGeo, globeMat);
                this.scene.add(this.globe);

                // Chrome Gold Rings
                const ringGeo = new THREE.TorusGeometry(3.7, 0.09, 16, 100);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: 0xf59e0b,
                    metalness: 0.95,
                    roughness: 0.15
                });
                
                const ring1 = new THREE.Mesh(ringGeo, ringMat);
                ring1.rotation.x = Math.PI / 2;
                this.globe.add(ring1);

                const ring2 = new THREE.Mesh(ringGeo, ringMat);
                ring2.rotation.y = Math.PI / 2;
                this.globe.add(ring2);

                // Base Stand
                const baseGeo = new THREE.CylinderGeometry(2.5, 3.2, 1.2, 32);
                const baseMat = new THREE.MeshStandardMaterial({
                    color: 0x0f172a,
                    metalness: 0.8,
                    roughness: 0.2
                });
                const base = new THREE.Mesh(baseGeo, baseMat);
                base.position.y = -4.1;
                this.scene.add(base);

                // Top Vacuum Cylinder
                const tubeGeo = new THREE.CylinderGeometry(0.75, 0.75, 2.2, 32, 1, true);
                const tubeMat = new THREE.MeshPhysicalMaterial({
                    color: 0x38bdf8,
                    transparent: true,
                    opacity: 0.45,
                    transmission: 0.8,
                    roughness: 0.1
                });
                this.topTube = new THREE.Mesh(tubeGeo, tubeMat);
                this.topTube.position.y = 4.2;
                this.scene.add(this.topTube);
            }

            // Particle System Inside Machine
            createParticleSystem() {
                const particleCount = 120;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 6;
                    positions[i + 1] = (Math.random() - 0.5) * 6;
                    positions[i + 2] = (Math.random() - 0.5) * 6;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const material = new THREE.PointsMaterial({
                    color: 0xfef08a,
                    size: 0.08,
                    transparent: true,
                    opacity: 0.7,
                    blending: THREE.AdditiveBlending
                });

                this.particleSystem = new THREE.Points(geometry, material);
                this.scene.add(this.particleSystem);
            }

            createBallTexture(num) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');

                const colors = this.getBallColor(num);

                // Glossy gradient background
                const grad = ctx.createRadialGradient(90, 90, 10, 128, 128, 120);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.35, colors.main);
                grad.addColorStop(1, '#020617');
                
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 256, 256);

                // Center White Badge
                ctx.beginPath();
                ctx.arc(128, 128, 62, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 7;
                ctx.strokeStyle = colors.main;
                ctx.stroke();

                // Number
                ctx.font = '900 68px "Pretendard", sans-serif';
                ctx.fillStyle = colors.text;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(num.toString(), 128, 128);

                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;
                return texture;
            }

            createBalls() {
                const ballGeo = new THREE.SphereGeometry(0.48, 24, 24);

                for (let i = 1; i <= 29; i++) {
                    const texture = this.createBallTexture(i);
                    const ballMat = new THREE.MeshStandardMaterial({
                        map: texture,
                        roughness: 0.2,
                        metalness: 0.1
                    });

                    const mesh = new THREE.Mesh(ballGeo, ballMat);
                    mesh.castShadow = true;

                    mesh.position.set(
                        (Math.random() - 0.5) * 4,
                        (Math.random() - 0.5) * 4,
                        (Math.random() - 0.5) * 4
                    );

                    const ballObj = {
                        mesh: mesh,
                        number: i,
                        vel: new THREE.Vector3(
                            (Math.random() - 0.5) * 0.2,
                            (Math.random() - 0.5) * 0.2,
                            (Math.random() - 0.5) * 0.2
                        ),
                        isExtracted: false
                    };

                    this.balls.push(ballObj);
                    this.scene.add(mesh);
                }
            }

            updatePhysics() {
                const radiusLimit = 3.1;

                // Animate Stardust Particles
                if (this.particleSystem) {
                    this.particleSystem.rotation.y += 0.005;
                    this.particleSystem.rotation.x += 0.002;
                }

                // Strobe light shifting during mixing
                if (this.isMixing && this.spotLight) {
                    const time = Date.now() * 0.003;
                    this.blueLight.intensity = 2 + Math.sin(time) * 1.5;
                    this.purpleLight.intensity = 2 + Math.cos(time) * 1.5;
                }

                this.balls.forEach((b1, idx) => {
                    if (b1.isExtracted) return;

                    if (this.isMixing) {
                        b1.vel.x += (Math.random() - 0.5) * 0.03;
                        b1.vel.y += (Math.random() - 0.45) * 0.04; 
                        b1.vel.z += (Math.random() - 0.5) * 0.03;
                    }

                    b1.mesh.position.add(b1.vel);
                    b1.mesh.rotation.x += b1.vel.z * 2.5;
                    b1.mesh.rotation.z -= b1.vel.x * 2.5;

                    b1.vel.multiplyScalar(0.97);

                    const distFromCenter = b1.mesh.position.length();
                    if (distFromCenter > radiusLimit) {
                        b1.mesh.position.normalize().multiplyScalar(radiusLimit);
                        b1.vel.reflect(b1.mesh.position.clone().normalize());
                        b1.vel.multiplyScalar(0.75);

                        if (Math.random() < 0.12 && this.isMixing) {
                            soundEngine.playPop();
                        }
                    }

                    // Collision between balls
                    for (let j = idx + 1; j < this.balls.length; j++) {
                        const b2 = this.balls[j];
                        if (b2.isExtracted) continue;

                        const diff = new THREE.Vector3().subVectors(b1.mesh.position, b2.mesh.position);
                        const dist = diff.length();
                        const minDist = 0.96;

                        if (dist < minDist && dist > 0) {
                            diff.normalize();
                            const overlap = 0.5 * (minDist - dist);
                            b1.mesh.position.addScaledVector(diff, overlap);
                            b2.mesh.position.addScaledVector(diff, -overlap);

                            const v1 = b1.vel.dot(diff);
                            const v2 = b2.vel.dot(diff);
                            b1.vel.addScaledVector(diff, (v2 - v1) * 0.85);
                            b2.vel.addScaledVector(diff, (v1 - v2) * 0.85);
                        }
                    }
                });
            }

            drawSingleBall(callback) {
                if (this.isDrawing) return;
                
                const available = this.balls.filter(b => !b.isExtracted);
                if (available.length === 0 || this.drawnNumbers.length >= 7) return;

                this.isDrawing = true;

                const selected = available[Math.floor(Math.random() * available.length)];
                selected.isExtracted = true;

                soundEngine.playRiser();

                // Camera Shake & Micro Zoom Effect
                const origCamZ = this.camera.position.z;
                this.camera.position.z = 11.5;

                const startPos = selected.mesh.position.clone();
                const tubePos = new THREE.Vector3(0, 4.8, 0);
                
                let progress = 0;
                const animateExtraction = () => {
                    progress += 0.05;
                    if (progress < 1) {
                        selected.mesh.position.lerpVectors(startPos, tubePos, progress);
                        selected.mesh.scale.setScalar(1 - progress * 0.3);
                        requestAnimationFrame(animateExtraction);
                    } else {
                        selected.mesh.position.set(0, 10, 0);
                        selected.mesh.scale.setScalar(1);
                        this.camera.position.z = origCamZ; // Reset camera

                        this.drawnNumbers.push(selected.number);
                        this.isDrawing = false;

                        if (callback) callback(selected.number);
                    }
                };

                animateExtraction();
            }

            reset() {
                this.drawnNumbers = [];
                this.balls.forEach(b => {
                    b.isExtracted = false;
                    b.mesh.position.set(
                        (Math.random() - 0.5) * 4,
                        (Math.random() - 0.5) * 4,
                        (Math.random() - 0.5) * 4
                    );
                    b.mesh.scale.setScalar(1);
                });
            }

            setupInteraction() {
                let isDragging = false;
                let prevMouseX = 0;
                let prevMouseY = 0;

                const dom = this.renderer.domElement;

                dom.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    prevMouseX = e.clientX;
                    prevMouseY = e.clientY;
                });

                window.addEventListener('mouseup', () => isDragging = false);

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const deltaX = e.clientX - prevMouseX;
                    const deltaY = e.clientY - prevMouseY;

                    this.globe.rotation.y += deltaX * 0.008;
                    this.globe.rotation.x += deltaY * 0.008;

                    prevMouseX = e.clientX;
                    prevMouseY = e.clientY;
                });

                dom.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        isDragging = true;
                        prevMouseX = e.touches[0].clientX;
                        prevMouseY = e.touches[0].clientY;
                    }
                });

                window.addEventListener('touchend', () => isDragging = false);

                window.addEventListener('touchmove', (e) => {
                    if (!isDragging || e.touches.length !== 1) return;
                    const deltaX = e.touches[0].clientX - prevMouseX;
                    const deltaY = e.touches[0].clientY - prevMouseY;

                    this.globe.rotation.y += deltaX * 0.008;
                    this.globe.rotation.x += deltaY * 0.008;

                    prevMouseX = e.touches[0].clientX;
                    prevMouseY = e.touches[0].clientY;
                });
            }

            onWindowResize() {
                const width = this.container.clientWidth;
                const height = this.container.clientHeight;
                this.camera.aspect = width / height;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(width, height);
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                
                if (this.globe) {
                    this.globe.rotation.y += 0.0025;
                }

                this.updatePhysics();
                this.renderer.render(this.scene, this.camera);
            }
        }

        // =========================================================
        // MAIN APP CONTROLLER & SUSPENSE TICKER LOGIC
        // =========================================================
        let machine = null;
        let autoDrawInterval = null;
        let historyData = [];

        window.onload = function() {
            machine = new Lotto3DMachine('canvasContainer');
            renderNumberGrid();
            updateStats();
            setupUIEvents();
        };

        function renderNumberGrid() {
            const grid = document.getElementById('numberGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= 29; i++) {
                const isExtracted = machine ? machine.drawnNumbers.includes(i) : false;
                const colors = getBallColorStyle(i);

                const item = document.createElement('div');
                item.id = `num-badge-${i}`;
                item.className = `p-2 rounded-xl border text-center font-black text-xs transition-all duration-300 flex flex-col items-center justify-center ${
                    isExtracted 
                        ? 'bg-slate-900 border-slate-800 text-slate-600 scale-90 opacity-40 line-through' 
                        : `${colors.bg} ${colors.border} ${colors.text} hover:scale-105 shadow-md`
                }`;
                item.innerHTML = `<span>${i}</span>`;
                grid.appendChild(item);
            }

            const remCount = document.getElementById('remainingCountText');
            if (remCount && machine) {
                remCount.innerText = `남은 공: ${29 - machine.drawnNumbers.length}개`;
            }
        }

        function getBallColorStyle(num) {
            if (num <= 10) return { bg: 'bg-amber-500/10', border: 'border-amber-500/40', text: 'text-amber-400', mainBg: 'bg-gradient-to-tr from-amber-500 via-yellow-400 to-amber-600' };
            if (num <= 20) return { bg: 'bg-cyan-500/10', border: 'border-cyan-500/40', text: 'text-cyan-400', mainBg: 'bg-gradient-to-tr from-cyan-500 via-blue-400 to-cyan-600' };
            return { bg: 'bg-purple-500/10', border: 'border-purple-500/40', text: 'text-purple-400', mainBg: 'bg-gradient-to-tr from-purple-500 via-pink-500 to-fuchsia-600' };
        }

        function updateStats() {
            if (!machine) return;
            const nums = machine.drawnNumbers;
            if (nums.length === 0) {
                document.getElementById('oddEvenStat').innerText = '0 : 0';
                document.getElementById('sumStat').innerText = '0';
                document.getElementById('avgStat').innerText = '0.0';
                return;
            }

            const odds = nums.filter(n => n % 2 !== 0).length;
            const evens = nums.length - odds;
            const sum = nums.reduce((a, b) => a + b, 0);
            const avg = (sum / nums.length).toFixed(1);

            document.getElementById('oddEvenStat').innerText = `${odds} : ${evens}`;
            document.getElementById('sumStat').innerText = `${sum}`;
            document.getElementById('avgStat').innerText = `${avg}`;
        }

        function setupUIEvents() {
            const soundBtn = document.getElementById('soundToggleBtn');
            const bgmBtn = document.getElementById('bgmToggleBtn');
            const drawAutoBtn = document.getElementById('drawAutoBtn');
            const drawOneBtn = document.getElementById('drawOneBtn');
            const mixBtn = document.getElementById('mixBtn');
            const resetBtn = document.getElementById('resetAllBtn');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');

            // Sound Toggle
            soundBtn.addEventListener('click', () => {
                soundEngine.playClick();
                soundEngine.enabled = !soundEngine.enabled;
                const icon = document.getElementById('soundIcon');
                const label = document.getElementById('soundLabel');
                if (soundEngine.enabled) {
                    icon.className = 'fas fa-volume-high text-amber-400';
                    label.innerText = '효과음 ON';
                } else {
                    icon.className = 'fas fa-volume-xmark text-slate-500';
                    label.innerText = '효과음 OFF';
                }
            });

            // BGM Toggle
            bgmBtn.addEventListener('click', () => {
                soundEngine.playClick();
                const active = soundEngine.toggleBGM();
                const icon = document.getElementById('bgmIcon');
                const label = document.getElementById('bgmLabel');
                if (active) {
                    icon.className = 'fas fa-music text-purple-400 animate-bounce';
                    label.innerText = 'BGM ON';
                } else {
                    icon.className = 'fas fa-music text-slate-500';
                    label.innerText = 'BGM OFF';
                }
            });

            // Mix
            mixBtn.addEventListener('click', () => {
                soundEngine.playClick();
                machine.isMixing = true;
                machine.balls.forEach(b => {
                    if (!b.isExtracted) {
                        b.vel.set(
                            (Math.random() - 0.5) * 0.5,
                            (Math.random() - 0.5) * 0.5,
                            (Math.random() - 0.5) * 0.5
                        );
                    }
                });
                updateStatusText('공들을 격렬하게 혼합하는 중...');
            });

            // Single Draw
            drawOneBtn.addEventListener('click', () => {
                soundEngine.playClick();
                if (machine.drawnNumbers.length >= 7) {
                    updateStatusText('이미 7개 번호(6개+보너스)가 완료되었습니다!');
                    return;
                }
                executeSingleDraw();
            });

            // Auto Draw
            drawAutoBtn.addEventListener('click', () => {
                soundEngine.playClick();
                if (machine.drawnNumbers.length >= 7) {
                    resetDrawState();
                }

                drawAutoBtn.disabled = true;
                drawOneBtn.disabled = true;
                drawAutoBtn.classList.add('opacity-50', 'cursor-not-allowed');

                updateStatusText('자동 연속 추첨 진행 중...');

                autoDrawInterval = setInterval(() => {
                    if (machine.drawnNumbers.length >= 7 || machine.isDrawing) {
                        if (machine.drawnNumbers.length >= 7) {
                            clearInterval(autoDrawInterval);
                            drawAutoBtn.disabled = false;
                            drawOneBtn.disabled = false;
                            drawAutoBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                        }
                        return;
                    }
                    executeSingleDraw();
                }, 2000);
            });

            // Reset
            resetBtn.addEventListener('click', () => {
                soundEngine.playClick();
                resetDrawState();
            });

            // Clear History
            clearHistoryBtn.addEventListener('click', () => {
                soundEngine.playClick();
                historyData = [];
                renderHistory();
            });
        }

        function executeSingleDraw() {
            if (machine.isDrawing) return;

            const slotIndex = machine.drawnNumbers.length;
            const isBonus = slotIndex === 6;

            updateStatusText(isBonus ? '⚡ 보너스 번호 추출!' : `⚡ ${slotIndex + 1}번째 행운 번호 추출 중...`);

            machine.drawSingleBall((finalNum) => {
                // Suspense Slot Roll Animation Modal
                showSuspenseRollReveal(finalNum, slotIndex, isBonus, () => {
                    placeBallInSlot(slotIndex, finalNum, isBonus);
                    renderNumberGrid();
                    updateStats();

                    const progressText = document.getElementById('drawProgressText');
                    if (progressText) progressText.innerText = `${machine.drawnNumbers.length} / 7`;

                    // Confetti Pop on every draw
                    if (typeof confetti === 'function') {
                        confetti({
                            particleCount: isBonus ? 120 : 60,
                            spread: isBonus ? 100 : 60,
                            origin: { y: 0.6 }
                        });
                    }

                    // Complete round check
                    if (machine.drawnNumbers.length === 7) {
                        updateStatusText('🎉 7개 행운의 번호가 모두 완성되었습니다!');
                        setTimeout(() => {
                            soundEngine.playFanfare();
                            if (typeof confetti === 'function') {
                                confetti({
                                    particleCount: 200,
                                    spread: 120,
                                    origin: { y: 0.5 }
                                });
                            }
                        }, 250);

                        saveToHistory(machine.drawnNumbers);
                    }
                });
            });
        }

        // SUSPENSE SLOT TICKER MODAL REVEAL
        function showSuspenseRollReveal(targetNum, slotIndex, isBonus, completionCallback) {
            const overlay = document.getElementById('revealOverlay');
            const bigCircle = document.getElementById('bigBallCircle');
            const bigNum = document.getElementById('bigBallNumber');
            const bigTag = document.getElementById('bigBallTag');
            const titleEl = document.getElementById('revealTitle');
            const subEl = document.getElementById('revealSub');

            const colors = getBallColorStyle(targetNum);

            bigCircle.className = `w-44 h-44 sm:w-56 sm:h-56 rounded-full flex flex-col items-center justify-center text-slate-950 font-black text-6xl sm:text-8xl shadow-2xl z-10 border-4 border-white/90 animate-reveal-super animate-super-glow relative overflow-hidden ${colors.mainBg}`;
            
            if (isBonus) {
                bigTag.innerText = "★ BONUS ★";
                titleEl.innerText = "✨ 보너스 행운 번호 등장!";
                titleEl.className = "text-2xl sm:text-4xl font-black text-pink-400 drop-shadow-lg animate-bounce";
                subEl.innerText = "마지막 행운의 보너스 구슬입니다!";
            } else {
                bigTag.innerText = `${slotIndex + 1}번 슬롯`;
                titleEl.innerText = `✨ ${slotIndex + 1}번째 행운 번호 추첨!`;
                titleEl.className = "text-2xl sm:text-4xl font-black text-amber-300 drop-shadow-lg";
                subEl.innerText = "번호판 슬롯에 차곡차곡 누적됩니다";
            }

            // Show Overlay
            overlay.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
            overlay.classList.add('opacity-100', 'scale-100');

            // Rapid Slot Ticker Roll
            let counter = 0;
            const totalTicks = 16;
            const tickerInterval = setInterval(() => {
                counter++;
                const randomNum = Math.floor(Math.random() * 29) + 1;
                bigNum.innerText = randomNum < 10 ? `0${randomNum}` : randomNum;
                
                soundEngine.playTicker();

                if (counter >= totalTicks) {
                    clearInterval(tickerInterval);
                    // Snap to target number
                    bigNum.innerText = targetNum < 10 ? `0${targetNum}` : targetNum;
                    
                    if (isBonus) {
                        titleEl.innerText = `🎉 보너스 번호: ${targetNum}번!`;
                    } else {
                        titleEl.innerText = `🎉 ${slotIndex + 1}번째 번호: ${targetNum}번!`;
                    }

                    soundEngine.playDramaticReveal(isBonus);

                    // Dismiss after reveal
                    setTimeout(() => {
                        overlay.classList.remove('opacity-100', 'scale-100');
                        overlay.classList.add('opacity-0', 'pointer-events-none', 'scale-95');

                        if (completionCallback) completionCallback();
                    }, 1200);
                }
            }, 60);
        }

        function placeBallInSlot(slotIndex, num, isBonus = false) {
            const slots = document.querySelectorAll('.ball-slot');
            if (slotIndex >= slots.length) return;

            const targetSlot = slots[slotIndex];
            const colors = getBallColorStyle(num);

            targetSlot.innerHTML = `
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full ${colors.mainBg} text-slate-950 font-black text-sm sm:text-base flex items-center justify-center shadow-lg shadow-black/50 border border-white/50 animate-ball-pop">
                    ${num}
                </div>
            `;
        }

        function resetDrawState() {
            if (autoDrawInterval) clearInterval(autoDrawInterval);
            
            machine.reset();

            const slots = document.querySelectorAll('.ball-slot');
            slots.forEach((slot, idx) => {
                if (idx === 6) {
                    slot.innerHTML = `<span class="absolute -top-2 text-[9px] font-bold bg-pink-600 text-white px-1.5 py-0.5 rounded-full shadow">보너스</span>`;
                } else {
                    slot.innerHTML = '';
                }
            });

            const drawAutoBtn = document.getElementById('drawAutoBtn');
            const drawOneBtn = document.getElementById('drawOneBtn');
            if (drawAutoBtn) {
                drawAutoBtn.disabled = false;
                drawAutoBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
            if (drawOneBtn) {
                drawOneBtn.disabled = false;
                drawOneBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            const progressText = document.getElementById('drawProgressText');
            if (progressText) progressText.innerText = `0 / 7`;

            renderNumberGrid();
            updateStats();
            updateStatusText('대기 중 (1~29번 공 준비 완료)');
        }

        function updateStatusText(text) {
            const statusEl = document.getElementById('machineStatus');
            if (statusEl) {
                statusEl.innerHTML = `<i class="fas fa-sparkles animate-spin text-amber-400 mr-1.5"></i>${text}`;
            }
        }

        function saveToHistory(numbers) {
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            
            const mainNumbers = numbers.slice(0, 6).sort((a, b) => a - b);
            const bonusNumber = numbers[6];

            historyData.unshift({
                time: timeStr,
                mains: mainNumbers,
                bonus: bonusNumber
            });

            renderHistory();
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            const emptyMsg = document.getElementById('emptyHistoryMsg');

            if (historyData.length === 0) {
                if (emptyMsg) emptyMsg.classList.remove('hidden');
                historyList.innerHTML = '';
                if (emptyMsg) historyList.appendChild(emptyMsg);
                return;
            }

            if (emptyMsg) emptyMsg.classList.add('hidden');
            historyList.innerHTML = '';

            historyData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'p-3 rounded-xl bg-slate-900/90 border border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs shadow-md animate-ball-pop';

                let ballsHtml = '<div class="flex items-center gap-1.5 flex-wrap">';
                item.mains.forEach(num => {
                    const colors = getBallColorStyle(num);
                    ballsHtml += `<span class="w-6 h-6 rounded-full ${colors.mainBg} text-slate-950 font-black flex items-center justify-center text-[11px] shadow">${num}</span>`;
                });
                
                // Bonus ball
                const bonusColors = getBallColorStyle(item.bonus);
                ballsHtml += `<span class="text-slate-500 font-bold px-0.5">+</span>`;
                ballsHtml += `<span class="w-6 h-6 rounded-full ${bonusColors.mainBg} text-slate-950 font-black flex items-center justify-center text-[11px] ring-2 ring-pink-500/60 shadow">${item.bonus}</span>`;
                ballsHtml += '</div>';

                card.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="font-black text-amber-400">#${historyData.length - index}회차</span>
                        <span class="text-[10px] text-slate-500">${item.time}</span>
                    </div>
                    ${ballsHtml}
                `;

                historyList.appendChild(card);
            });
        }
    </script>
</body>
</html>
